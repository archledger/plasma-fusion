<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  SPDX-FileCopyrightText: 2026 Wisbendji Fimerlus <archledger236@gmail.com>
  SPDX-License-Identifier: GPL-2.0-or-later

  The lock screen harness's private session bus (run.sh): no service directories, so nothing is
  activated on it. With the standard session configuration every run started a desktop portal
  that outlived the bus (and held the caller's output pipe open).
-->
<busconfig>
  <type>session</type>
  <keep_umask/>
  <listen>unix:tmpdir=/tmp</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
