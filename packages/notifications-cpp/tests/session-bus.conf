<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  SPDX-FileCopyrightText: 2026 Wisbendji Fimerlus <archledger236@gmail.com>
  SPDX-License-Identifier: GPL-2.0-or-later

  The private session bus of the focus shortcut test (run-shortcut-test.sh): no service
  directories, so nothing is activated on it (as packages/kcm-cpp/tests/session-bus.conf). The
  global shortcut daemon is not there; the class under test then keeps its shortcuts to itself.
-->
<busconfig>
  <type>session</type>
  <keep_umask/>
  <listen>unix:tmpdir=/tmp</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
