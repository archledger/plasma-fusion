#
# ClusterFuzzLite on pull requests (docs/parts/ci.md, "Fuzzing"): builds the fuzzers in fuzz/ with
# .clusterfuzzlite/ and runs them for five minutes in all against the change (code-change mode),
# starting from the corpus the weekly batch run keeps as artifacts. A crash or a failed property
# fails the check and its input is kept as an artifact. The actions clone the repository themselves
# (no checkout step) and run in their own containers. OSS-Fuzz builds Python fuzzers only with a
# sanitizer named (address or undefined): undefined, because the fuzzed tools are pure Python and
# AddressSanitizer, preloaded into an interpreter not built with it, finds nothing more there and
# runs a fifth to two thirds as many inputs.

name: cflite-pr

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".clusterfuzzlite/**"
      - ".github/workflows/cflite-pr.yml"
      - "fuzz/**"
      - "packages/appicons/plasma-fusion-app-icons"
      - "packages/keyboard/plasma-fusion-keyboard-keys"
      - "tools/device/previous-theme.py"

permissions:
  contents: read

concurrency:
  group: cflite-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: "ClusterFuzzLite (pull request)"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read # the batch runs' corpus artifacts
      contents: read
    steps:
      - name: Build the fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          sanitizer: undefined
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the fuzzers
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          sanitizer: undefined
          mode: code-change
          fuzz-seconds: 300
          github-token: ${{ secrets.GITHUB_TOKEN }}
