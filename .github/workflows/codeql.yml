#
# CodeQL code scanning (docs/parts/ci.md): the compiled parts (C++), the Python tools, the
# JavaScript of the shell and the workflows themselves, on every push and pull request and weekly.
# Results appear in the Security tab. A workflow file instead of GitHub's default setup, so the
# action versions are pinned and audited like the others and Scorecard can see the SAST step.
# C++ is analysed without building (build mode none): a build needs the KDE development packages,
# which the compiled workflow installs in a Fedora container.

name: codeql

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "30 3 * * 3" # Wednesdays 03:30 UTC

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: "CodeQL (${{ matrix.language }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      security-events: write # upload the results to the Security tab
      actions: read # read the pull request run context
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, c-cpp, javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
