#
# OpenSSF Scorecard (docs/parts/ci.md): scores the build and release path on every push to main and
# weekly. Are actions pinned to a commit, is the token read-only, does a workflow run untrusted code
# with write access, is there a security policy and branch protection. Plasma Fusion installs a
# pkexec helper and the lock screen, so a compromised build is a compromised machine. Findings
# appear in the Security tab (code scanning); the published score backs the README badge.

name: scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "18 4 * * 1" # Mondays 04:18 UTC
  push:
    branches: ["main"]

permissions: read-all

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: "Scorecard analysis"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      security-events: write # upload the SARIF result to code scanning
      id-token: write # sign the result for the public Scorecard API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish to the public OpenSSF API so the score is verifiable and the badge works.
          publish_results: true

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
