<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  SPDX-FileCopyrightText: 2026 Wisbendji Fimerlus <archledger236@gmail.com>
  SPDX-License-Identifier: GPL-2.0-or-later

  Plasma Fusion: fallback fonts for the scripts Manrope and Space Grotesk do not cover (GAPS G28).
  Manrope has Latin, Cyrillic and Greek but no Vietnamese, Arabic, Hebrew, Indic or CJK letters;
  Space Grotesk has Latin and Vietnamese but no Cyrillic or Greek. Qt asks fontconfig for the
  fallback list of the requested family (with the text's language), so these rules decide which font
  draws such letters: Noto Sans first (the Fusion boards' neutral sans), then the Noto family of the
  script, then the system's own sans-serif chain. CJK falls back by language to the matching regional
  Noto Sans CJK font, so Chinese, Japanese and Korean keep their own glyph forms; Han text without a
  language hint (Chinese in an English session) gets Noto Sans CJK SC instead of Droid Sans Fallback.
  Rendering settings (antialiasing, hinting) are not set here; the Fonts settings page owns them.
  Installed per user as ~/.config/fontconfig/conf.d/60-plasma-fusion-fallback.conf; fonts that are not
  installed are skipped.
-->
<fontconfig>
  <description>Plasma Fusion: Noto fallbacks for Manrope and Space Grotesk</description>

  <!-- Both families are sans-serif; the generic sans-serif chain comes last. -->
  <alias binding="weak">
    <family>Manrope</family>
    <accept>
      <family>Noto Sans</family>
      <family>Noto Sans Arabic</family>
      <family>Noto Sans Hebrew</family>
      <family>Noto Sans Devanagari</family>
      <family>Noto Sans Bengali</family>
      <family>Noto Sans Tamil</family>
      <family>Noto Sans Thai</family>
      <family>Noto Sans Armenian</family>
      <family>Noto Sans Georgian</family>
      <family>Noto Sans Ethiopic</family>
      <!-- Han text without a language hint (for example Chinese in an English session) -->
      <family>Noto Sans CJK SC</family>
    </accept>
    <default><family>sans-serif</family></default>
  </alias>
  <!-- Space Grotesk (display headings): Manrope first, it has the Cyrillic and Greek letters. -->
  <alias binding="weak">
    <family>Space Grotesk</family>
    <accept>
      <family>Manrope</family>
      <family>Noto Sans</family>
      <family>Noto Sans Arabic</family>
      <family>Noto Sans Hebrew</family>
      <family>Noto Sans Devanagari</family>
      <family>Noto Sans Bengali</family>
      <family>Noto Sans Tamil</family>
      <family>Noto Sans Thai</family>
      <family>Noto Sans Armenian</family>
      <family>Noto Sans Georgian</family>
      <family>Noto Sans Ethiopic</family>
      <!-- Han text without a language hint (for example Chinese in an English session) -->
      <family>Noto Sans CJK SC</family>
    </accept>
    <default><family>sans-serif</family></default>
  </alias>

  <!-- CJK: the regional Noto Sans CJK font for the text's language, right after the Fusion family. -->
  <match target="pattern">
    <test name="family"><string>Manrope</string></test>
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <edit name="family" mode="append" binding="weak"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Manrope</string></test>
    <test name="lang" compare="contains"><string>zh-sg</string></test>
    <edit name="family" mode="append" binding="weak"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Manrope</string></test>
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <edit name="family" mode="append" binding="weak"><string>Noto Sans CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Manrope</string></test>
    <test name="lang" compare="contains"><string>zh-hk</string></test>
    <edit name="family" mode="append" binding="weak"><string>Noto Sans CJK HK</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Manrope</string></test>
    <test name="lang" compare="contains"><string>ja</string></test>
    <edit name="family" mode="append" binding="weak"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Manrope</string></test>
    <test name="lang" compare="contains"><string>ko</string></test>
    <edit name="family" mode="append" binding="weak"><string>Noto Sans CJK KR</string></edit>
  </match>
</fontconfig>
