<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plasma Fusion — boot splash</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Manrope',system-ui,sans-serif;background:#000000;color:#e8ebf4}
button{font:inherit;color:inherit;border:0;padding:0;margin:0;background:none;cursor:default}
svg{display:block;flex-shrink:0}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
a{color:#8ab8ff}a:hover{color:#b9d4ff}
</style>
</helmet>
<div style="position:relative;width:1440px;height:900px;overflow:hidden;background:#000000;color:#e8ebf4;font-size:13px">

<div style="position:absolute;left:0;top:250px;width:1440px;display:flex;flex-direction:column;align-items:center;gap:44px">
<svg width="96" height="96" viewBox="0 0 24 24" aria-label="Plasma Fusion">
<g style="mix-blend-mode:screen"><circle cx="12" cy="8.5" r="5.5" fill="#5b9dff"></circle><circle cx="8" cy="15" r="5.5" fill="#f2a65a"></circle><circle cx="16" cy="15" r="5.5" fill="#3cc4b0"></circle></g>
</svg>

<form aria-label="Unlock disk" style="width:360px;display:flex;flex-direction:column;align-items:center;gap:14px;margin:0">
<span style="font-size:14px;color:#a3abc2">Enter the passphrase to unlock this disk</span>
<div style="width:100%;height:46px;box-sizing:border-box;padding:0 6px 0 16px;border-radius:23px;background:#111522;border:1.5px solid #5b9dff;display:flex;align-items:center;gap:8px">
<svg class="i" width="17" height="17" viewBox="0 0 24 24" style="color:#a3abc2"><path d="M7 11h10a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2zM8 11V8a4 4 0 0 1 8 0v3"></path></svg>
<span style="flex-grow:1;letter-spacing:0.3em;font-size:15px">••••••••••</span>
<button type="submit" aria-label="Unlock" style="width:34px;height:34px;border-radius:17px;background:#2f6fdf;color:#ffffff;display:flex;align-items:center;justify-content:center"><svg class="i" width="16" height="16" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
</div>
<span style="font-size:12px;color:#6f7892">Internal drive · 512 GB</span>
</form>
</div>

<div aria-label="Starting" style="position:absolute;left:0;bottom:120px;width:1440px;display:flex;justify-content:center;gap:10px">
<span style="width:8px;height:8px;border-radius:4px;background:#5b9dff"></span>
<span style="width:8px;height:8px;border-radius:4px;background:#f2a65a;opacity:0.55"></span>
<span style="width:8px;height:8px;border-radius:4px;background:#3cc4b0;opacity:0.25"></span>
</div>

<div style="position:absolute;left:32px;bottom:28px;font-size:11.5px;color:#4a5168">Esc shows boot messages</div>
<div style="position:absolute;right:32px;bottom:28px;display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;color:#6f7892"><svg class="i" width="14" height="14" viewBox="0 0 24 24"><path d="M3 7h18v10H3zM7 11h.01M11 11h.01M15 11h.01M8 14h8"></path></svg>EN</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
