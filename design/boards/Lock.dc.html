<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plasma Fusion — lock screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Manrope',system-ui,sans-serif;background:#141a2e;color:#e8ebf4}
button{font:inherit;color:inherit;border:0;padding:0;margin:0;background:none;cursor:default}
svg{display:block;flex-shrink:0}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
a{color:#8ab8ff}a:hover{color:#b9d4ff}
</style>
</helmet>
<div style="position:relative;width:1440px;height:900px;overflow:hidden;background:#141a2e;color:#e8ebf4;font-size:13px">

<svg width="1440" height="900" viewBox="0 0 1440 900" aria-hidden="true" style="position:absolute;left:0;top:0">
<rect width="1440" height="900" fill="#141a2e"></rect>
<rect y="180" width="1440" height="160" fill="#181f3a"></rect>
<rect y="340" width="1440" height="220" fill="#1c2446"></rect>
<circle cx="1010" cy="360" r="212" fill="none" stroke="#f2a65a" stroke-opacity="0.18" stroke-width="2"></circle>
<circle cx="1010" cy="360" r="150" fill="#f2a65a"></circle>
<path d="M0 560 L180 430 L330 505 L520 350 L700 485 L860 405 L1060 520 L1240 385 L1440 470 L1440 900 L0 900 Z" fill="#253058"></path>
<path d="M0 650 L220 545 L420 620 L640 505 L880 612 L1100 540 L1300 622 L1440 580 L1440 900 L0 900 Z" fill="#2e3d73"></path>
<path d="M0 760 L260 662 L520 732 L780 642 L1040 722 L1280 662 L1440 702 L1440 900 L0 900 Z" fill="#3b56a0"></path>
<path d="M0 846 L300 786 L600 834 L900 774 L1200 824 L1440 792 L1440 900 L0 900 Z" fill="#5a7fd6"></path>
</svg>
<div aria-hidden="true" style="position:absolute;left:0;top:0;width:1440px;height:900px;background:rgba(8,10,22,0.22)"></div>

<div style="position:absolute;left:0;top:92px;width:1440px;display:flex;flex-direction:column;align-items:center;gap:6px;text-shadow:0 2px 20px rgba(0,0,0,0.35)">
<span style="font-size:20px;font-weight:700;color:#e8ebf4">Monday, 28 September</span>
<span style="font-family:'Space Grotesk',sans-serif;font-size:148px;font-weight:600;line-height:1;letter-spacing:-0.02em">14:49</span>
</div>

<button style="position:absolute;left:560px;top:430px;width:320px;height:48px;border-radius:24px;background:rgba(14,18,34,0.55);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.14);display:flex;align-items:center;justify-content:center;gap:10px;font-size:14px;font-weight:700">
<svg class="i" width="18" height="18" viewBox="0 0 24 24"><path d="M7 11h10a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2zM8 11V8a4 4 0 0 1 8 0v3"></path></svg>
Press any key or click to unlock
</button>

<div aria-label="Notifications while locked" style="position:absolute;left:520px;top:620px;width:400px;display:flex;flex-direction:column;gap:8px">
<div style="height:56px;box-sizing:border-box;padding:0 14px;border-radius:16px;background:rgba(14,18,34,0.6);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;gap:12px">
<dc-import name="AppIcon" app="calendar" size="30" hint-size="30px,30px"></dc-import>
<div style="flex-grow:1;display:flex;flex-direction:column;gap:1px"><span style="font-weight:800">Calendar</span><span style="font-size:12px;color:#b8bfd3">Event starting in 10 min</span></div>
<span style="font-size:11.5px;color:#a3abc2">14:50</span>
</div>
<div style="height:56px;box-sizing:border-box;padding:0 14px;border-radius:16px;background:rgba(14,18,34,0.6);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;gap:12px">
<dc-import name="AppIcon" app="mail" size="30" hint-size="30px,30px"></dc-import>
<div style="flex-grow:1;display:flex;flex-direction:column;gap:1px"><span style="font-weight:800">Mail</span><span style="font-size:12px;color:#b8bfd3">3 new messages · hidden while locked</span></div>
<span style="font-size:11.5px;color:#a3abc2">14:31</span>
</div>
</div>

<div aria-label="Media" style="position:absolute;left:32px;bottom:32px;width:300px;height:72px;box-sizing:border-box;padding:0 12px;border-radius:18px;background:rgba(14,18,34,0.6);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;gap:12px">
<dc-import name="AppIcon" app="music" size="44" hint-size="44px,44px"></dc-import>
<div style="flex-grow:1;display:flex;flex-direction:column;gap:2px"><span style="font-weight:800">Music</span><span style="font-size:12px;color:#b8bfd3">Paused</span></div>
<button aria-label="Play" style="width:38px;height:38px;border-radius:19px;background:#e8ebf4;color:#1b2031;display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z" fill="currentColor"></path></svg></button>
</div>

<div style="position:absolute;right:32px;bottom:32px;height:40px;box-sizing:border-box;padding:0 16px;border-radius:20px;background:rgba(14,18,34,0.6);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;gap:14px">
<span style="font-size:11px;font-weight:800;padding:2px 6px;border-radius:5px;border:1px solid rgba(255,255,255,0.25)">EN</span>
<svg class="i" width="17" height="17" viewBox="0 0 24 24"><path d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M12 19.5h.01"></path></svg>
<span style="display:flex;align-items:center;gap:5px"><svg class="i" width="19" height="19" viewBox="0 0 24 24"><path d="M4 7h14a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2zM22 11v2"></path><path d="M5 10h9v4H5z" style="fill:currentColor;stroke:none"></path></svg><span style="font-weight:700">82%</span></span>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
